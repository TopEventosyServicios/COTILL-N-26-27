<script>
(() => {
  'use strict';
  const dial = document.getElementById('dial');
  const freqRead = document.getElementById('freqRead');
  const statusMain = document.getElementById('statusMain');
  const statusSub = document.getElementById('statusSub');
  const soundBtn = document.getElementById('soundBtn');
  const signal = document.getElementById('signal');
  const broadcast = document.getElementById('broadcast');
  const videos = [1, 2, 3].map(i => document.getElementById('video' + i));
  const discoverBtn = document.getElementById('discoverBtn');
  const collageWrap = document.getElementById('collageWrap');
  const collageImgs = [...collageWrap.querySelectorAll('img[data-src]')];
  const collage = collageWrap.querySelector('.collage');
  const photoTiles = [...collage.querySelectorAll('.photo')];
  let photoPreparation = null, collageRequest = 0, collageWidth = 0;
  const bars = [];
  for (let i = 0; i < 31; i++) {
    const bar = document.createElement('span');
    bar.className = 'bar';
    signal.appendChild(bar);
    bars.push(bar);
  }

  // Preload the complete supplied audio; never mix in the previous soundtrack.
  const track = {url: 'audio-2027-corregido.mp3?v=20261008-volumen-v2', buffer: null, pending: null, error: false};
  let ctx = null, noiseGain = null, audioSource = null;
  let soundOn = false, tuned = false, transmitting = false;
  let currentVideo = 0, engineError = false;

  // On browsers that expose AudioSession, request the media playback category.
  function configurePlayback() {
    try {
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
    } catch (_) { /* Use the browser default when unsupported. */ }
  }

  function ensureAudio() {
    if (ctx) return;
    configurePlayback();
    const AudioEngine = window.AudioContext || window.webkitAudioContext;
    if (!AudioEngine) throw new Error('Audio no disponible');
    ctx = new AudioEngine({latencyHint: 'playback'});
    const buffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 1800; filter.Q.value = .65;
    noiseGain = ctx.createGain(); noiseGain.gain.value = 0;
    source.connect(filter).connect(noiseGain).connect(ctx.destination);
    source.start();
    ctx.addEventListener('statechange', () => {
      if (ctx.state === 'running') engineError = false;
      syncAudio();
      renderStatus();
    });
  }

  function setNoise(value) {
    if (!noiseGain) return;
    noiseGain.gain.cancelScheduledValues(ctx.currentTime);
    // Silence immediately on 2027, without residual interference.
    if (value === 0) noiseGain.gain.setValueAtTime(0, ctx.currentTime);
    else noiseGain.gain.setTargetAtTime(value, ctx.currentTime, .035);
  }

  function loadAudio() {
    if (track.buffer || track.pending || !ctx) return;
    track.error = false;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 25000);
    track.pending = fetch(track.url, {signal: controller.signal})
      .then(response => {
        if (!response.ok) throw new Error('Audio no cargado');
        return response.arrayBuffer();
      })
      .then(data => ctx.decodeAudioData(data))
      .then(buffer => { track.buffer = buffer; })
      .catch(() => { track.error = true; })
      .finally(() => {
        clearTimeout(timeout);
        track.pending = null;
        syncAudio();
        renderStatus();
      });
  }


  // Invoke resume() and start a silent sample INSIDE the original user gesture.
  // No fetch, await or timer is allowed before this mobile unlock.
  function resumeAudio() {
    if (!soundOn || !ctx || document.hidden) return;
    configurePlayback();
    if (ctx.state === 'running') { engineError = false; syncAudio(); return; }
    try {
      const resumed = ctx.resume();
      const silent = ctx.createBufferSource();
      silent.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
      silent.connect(ctx.destination);
      silent.onended = () => silent.disconnect();
      silent.start();
      Promise.resolve(resumed).then(() => {
        engineError = ctx.state !== 'running';
      }).catch(() => { engineError = true; }).finally(() => {
        syncAudio();
        renderStatus();
      });
    } catch (_) {
      engineError = true;
      renderStatus();
    }
  }

  function stopAudio() {
    transmitting = false;
    if (audioSource) {
      audioSource.onended = null;
      try { audioSource.stop(); } catch (_) { /* Already ended. */ }
      audioSource.disconnect();
      audioSource = null;
    }
  }

  function syncAudio() {
    if (!ctx) return;
    if (!soundOn || document.hidden || ctx.state !== 'running') { setNoise(0); return; }
    if (!tuned) {
      const distance = Math.abs(Number(dial.value) - 2027);
      setNoise(Math.max(.08, Math.min(.15, .09 + distance * .02)));
      return;
    }
    setNoise(0);
    if (!track.buffer || transmitting) return;
    try {
      const source = ctx.createBufferSource();
      source.buffer = track.buffer;
      source.connect(ctx.destination);
      audioSource = source;
      transmitting = true;
      source.onended = () => {
        if (audioSource !== source || !transmitting) return;
        source.disconnect();
        // Leave the supplied audio ending intact. Re-tuning restarts it.
        renderStatus();
      };
      source.start();
    } catch (_) {
      stopAudio(); engineError = true;
      renderStatus();
    }
  }

  function playVideo(index, reset = false) {
    currentVideo = index;
    videos.forEach((video, i) => {
      video.classList.toggle('active', i === index);
      if (i !== index) video.pause();
    });
    const video = videos[index];
    updateVideoFrame(video);
    video.muted = true;
    if (reset) { try { video.currentTime = 0; } catch (_) {} }
    if (!document.hidden) video.play().catch(() => {
      // A subsequent touch or page return retries a browser-interrupted video.
    });
  }
  function updateVideoFrame(video) {
    if (!video.videoWidth || !video.videoHeight) return;
    const frame = video.closest('.screen');
    frame.style.aspectRatio = video.videoWidth + ' / ' + video.videoHeight;
    frame.classList.toggle('landscape', video.videoWidth > video.videoHeight);
  }
  videos.forEach((video, index) => {
    video.addEventListener('loadedmetadata', () => { if (currentVideo === index) updateVideoFrame(video); });
    video.addEventListener('ended', () => {
      if (tuned) playVideo((index + 1) % videos.length, true);
    });
    video.addEventListener('error', () => {
      if (!tuned || currentVideo !== index) return;
      const next = videos.findIndex((item, i) => i !== index && !item.error);
      if (next >= 0) playVideo(next, true);
    });
  });

  function needsHelp() {
    return engineError || !ctx || ctx.state !== 'running' || track.error;
  }

  function renderStatus() {
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.textContent = !soundOn ? 'Activar sonido' :
      (track.error ? 'Reintentar sonido' :
        (engineError || !ctx || ctx.state !== 'running' ? 'Reactivar sonido' : 'Silenciar sonido'));
    if (tuned) {
      statusMain.innerHTML = 'Frecuencia <b>2027</b> · ¡La noche empieza aquí!';
      statusSub.textContent = !soundOn ? 'Pulsa Activar sonido para escuchar.' :
        (engineError || !ctx || ctx.state !== 'running' ? 'Pulsa Reactivar sonido para seguir escuchando.' :
          (track.error ? 'No se ha cargado el audio. Pulsa Reintentar sonido.' :
            (!track.buffer ? 'Preparando el audio… empezará en cuanto esté listo.' :
              '¡Bienvenidos a una noche única!')));
    } else {
      statusMain.textContent = 'Buscando señal…';
      statusSub.textContent = soundOn && needsHelp() ?
        (track.error ? 'Pulsa Reintentar sonido y acércate a 2027.' : 'Pulsa Reactivar sonido y acércate a 2027.') : 'ACÉRCATE A 2027';
    }
  }

  function preparePhotos() {
    if (photoPreparation) return photoPreparation;
    photoPreparation = Promise.all(collageImgs.map(img => {
      if (!img.getAttribute('src')) img.src = img.dataset.src;
      if (img.decode) return img.decode().catch(() => {});
      if (img.complete) return Promise.resolve();
      return new Promise(resolve => {
        img.addEventListener('load', resolve, {once: true});
        img.addEventListener('error', resolve, {once: true});
      });
    }));
    return photoPreparation;
  }

  // Choose rows of complete images, each with one shared top and bottom edge.
  function layoutCollage() {
    const width = collage.clientWidth;
    if (!width) return;
    const gap = parseFloat(getComputedStyle(collage).getPropertyValue('--collage-gap')) || 10;
    const target = width < 500 ? 140 : 200;
    const ratios = photoTiles.map(tile => Number(tile.dataset.ratio));
    const count = ratios.length;
    const costs = Array(count + 1).fill(Infinity);
    const next = Array(count).fill(count);
    costs[count] = 0;
    for (let first = count - 1; first >= 0; first--) {
      let sum = 0;
      for (let size = 1; size <= Math.min(width < 500 ? 3 : 5, count - first); size++) {
        sum += ratios[first + size - 1];
        const height = (width - gap * (size - 1)) / sum;
        const cost = Math.pow(Math.log(height / target), 2) + (size === 1 ? .1 : 0) + costs[first + size];
        if (cost < costs[first]) { costs[first] = cost; next[first] = first + size; }
      }
    }
    const rows = [];
    for (let first = 0; first < count;) {
      const last = next[first];
      const row = document.createElement('div');
      row.className = 'collage-row';
      const sum = ratios.slice(first, last).reduce((total, ratio) => total + ratio, 0);
      row.style.height = ((width - gap * (last - first - 1)) / sum) + 'px';
      for (let i = first; i < last; i++) {
        const tile = photoTiles[i];
        tile.style.flex = ratios[i] + ' 1 0px';
        tile.dataset.row = String(rows.length);
        row.appendChild(tile);
      }
      rows.push(row);
      first = last;
    }
    collage.replaceChildren(...rows);
    collageWidth = width;
  }

  if (window.ResizeObserver) {
    const layoutObserver = new ResizeObserver(() => {
      if (collageWrap.classList.contains('on') && Math.abs(collage.clientWidth - collageWidth) > 1) layoutCollage();
    });
    layoutObserver.observe(collage);
  } else window.addEventListener('resize', () => { if (collageWrap.classList.contains('on')) layoutCollage(); });

  function update() {
    const value = Math.max(2023, Math.min(2029, Number(dial.value) || 2025));
    const distance = Math.abs(value - 2027);
    const wasTuned = tuned;
    tuned = distance <= .075;
    if (tuned) dial.value = '2027';
    freqRead.textContent = tuned ? '2027' : value.toFixed(2).replace(/\.00$/, '');
    const strength = Math.max(0, 1 - Math.min(distance / 1.6, 1));
    bars.forEach((bar, i) => {
      const wave = (Math.sin(i * .87 + value * 1.9) + 1) / 2;
      bar.style.height = (8 + wave * 34 * strength + Math.random() * 4) + 'px';
      bar.style.opacity = String(.22 + .78 * strength);
    });
    broadcast.classList.toggle('on', tuned);
    if (tuned && !wasTuned) { playVideo(0, true); preparePhotos(); }
    if (!tuned && wasTuned) {
      stopAudio();
      videos.forEach(video => { video.pause(); try { video.currentTime = 0; } catch (_) {} });
      collageRequest++;
      discoverBtn.disabled = false;
      collageWrap.classList.remove('on');
      discoverBtn.textContent = 'Descubre el cotillón';
      discoverBtn.setAttribute('aria-expanded', 'false');
    }
    syncAudio();
    renderStatus();
  }

  function toggleSound() {
    if (soundOn && !needsHelp()) {
      soundOn = false;
      stopAudio(); setNoise(0); renderStatus(); return;
    }
    soundOn = true;
    engineError = false;
    try { ensureAudio(); resumeAudio(); loadAudio(); }
    catch (_) { engineError = true; }
    syncAudio(); renderStatus();
  }

  function recover() {
    if (soundOn) resumeAudio();
    if (tuned && videos[currentVideo].paused) playVideo(currentVideo);
  }
  discoverBtn.addEventListener('click', async () => {
    const request = ++collageRequest;
    discoverBtn.textContent = 'COTILLÓN 26/27';
    discoverBtn.disabled = true;
    await preparePhotos();
    if (!tuned || request !== collageRequest) return;
    collageWrap.classList.add('on');
    discoverBtn.setAttribute('aria-expanded', 'true');
    discoverBtn.disabled = false;
    layoutCollage();
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reducedMotion) {
      photoTiles.forEach(tile => {
        tile.getAnimations?.().forEach(animation => animation.cancel());
        tile.animate?.([
          {opacity: 0, transform: 'translateY(12px)'},
          {opacity: 1, transform: 'translateY(0)'}
        ], {duration: 700, delay: Math.min(Number(tile.dataset.row) * 45, 270), easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards'});
      });
    }
    requestAnimationFrame(() => collageWrap.scrollIntoView({behavior: reducedMotion ? 'auto' : 'smooth', block: 'start'}));
  });
  soundBtn.addEventListener('click', toggleSound);
  dial.addEventListener('input', () => { if (soundOn) resumeAudio(); update(); });
  dial.addEventListener('change', () => { if (soundOn) resumeAudio(); update(); });
  dial.addEventListener('pointerdown', recover);
  dial.addEventListener('keydown', recover);
  discoverBtn.addEventListener('pointerdown', recover);
  window.addEventListener('pageshow', recover);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      videos.forEach(video => video.pause());
      if (ctx && ctx.state === 'running') {
        ctx.suspend().then(() => { if (!document.hidden) recover(); }).catch(() => {});
      }
    } else recover();
    renderStatus();
  });
  try { ensureAudio(); loadAudio(); } catch (_) { engineError = true; }
  update();
})();

</script>
</body>
</html>
